<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .font-mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    /* Dynamic / Animated Keyframes */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.45; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
    }

    @keyframes radarScan {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatGlyph {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    @keyframes beamFlow {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 {
      animation: pulseOrb 10s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-2 {
      animation: pulseOrb 14s ease-in-out infinite reverse;
      transform-origin: center;
    }
    .floating-letter {
      animation: floatGlyph 6s ease-in-out infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .pill-3 { animation: floatPill 7s ease-in-out 2s infinite; }
    .pill-4 { animation: floatPill 5.5s ease-in-out 1.5s infinite; }
    .beam-line {
      stroke-dasharray: 20, 10;
      animation: beamFlow 12s linear infinite;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="420" fill="url(#matrixGrid)" />

  <!-- Dynamic Glowing Orbs (in Background) -->
  <circle class="orb-1" cx="200" cy="120" r="180" fill="#38bdf8" filter="url(#softGlow)" />
  <circle class="orb-2" cx="1020" cy="300" r="220" fill="#818cf8" filter="url(#softGlow)" />
  <circle cx="600" cy="210" r="280" fill="#c084fc" opacity="0.12" filter="url(#softGlow)" />

  <!-- Subtle Circuit Lines -->
  <path class="beam-line" d="M 50 100 L 250 100 L 320 170 L 600 170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
  <path class="beam-line" d="M 1150 320 L 950 320 L 880 250 L 600 250" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.35" />

  <!-- Background Typographic Silhouette (Embedded Font Outline Glyph 'Aa') -->
  <g class="floating-letter" opacity="0.08" transform="translate(900, 40)">
    <text x="0" y="240" font-size="280" font-family="'Times New Roman', serif" font-weight="bold" fill="none" stroke="#38bdf8" stroke-width="3">A</text>
    <text x="140" y="270" font-size="200" font-family="'Courier New', monospace" font-weight="bold" fill="none" stroke="#c084fc" stroke-width="2">a</text>
  </g>

  <!-- Foreground Main Content Container -->
  <g id="foreground-content" transform="translate(80, 0)">
    <!-- Category Mini-Pill Header -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="30" y="21" class="font-mono" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" class="font-title" font-size="46" fill="#ffffff" filter="url(#glow)">
      Awesome Embedded Font Technology
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="196" class="font-sub" font-size="20" fill="#94a3b8">
      Curated Guide to Embedded Font Engines, Vector Rasterizers, Glyph Rendering &amp; Typography Solutions
    </text>

    <text x="0" y="225" class="font-sub" font-size="15" fill="#64748b">
      From ultra-low-memory IoT microcontrollers to automotive HMIs, wearables, and multi-tenant SaaS rendering
    </text>

    <!-- Interactive / Floating Feature Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: FreeType -->
      <g class="pill-1" transform="translate(0, 0)">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" />
        <rect width="230" height="52" rx="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
        <circle cx="26" cy="26" r="10" fill="#0284c7" />
        <text x="26" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FT</text>
        <text x="48" y="24" class="font-title" font-size="14" fill="#f8fafc">FreeType 2 &amp; HarfBuzz</text>
        <text x="48" y="40" class="font-sub" font-size="11" fill="#94a3b8">Industry standard open-source</text>
      </g>

      <!-- Pill 2: Monotype -->
      <g class="pill-2" transform="translate(250, 0)">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" />
        <rect width="230" height="52" rx="12" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
        <circle cx="26" cy="26" r="10" fill="#6366f1" />
        <text x="26" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MT</text>
        <text x="48" y="24" class="font-title" font-size="14" fill="#f8fafc">Monotype Spark™ / iType®</text>
        <text x="48" y="40" class="font-sub" font-size="11" fill="#94a3b8">Automotive &amp; low-RAM MCUs</text>
      </g>

      <!-- Pill 3: Embedded UI -->
      <g class="pill-3" transform="translate(500, 0)">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" />
        <rect width="230" height="52" rx="12" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4" />
        <circle cx="26" cy="26" r="10" fill="#a855f7" />
        <text x="26" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LV</text>
        <text x="48" y="24" class="font-title" font-size="14" fill="#f8fafc">LVGL &amp; U8g2 Micro-Fonts</text>
        <text x="48" y="40" class="font-sub" font-size="11" fill="#94a3b8">Bitmap &amp; Sub-pixel on bare-metal</text>
      </g>

      <!-- Pill 4: STB Truetype -->
      <g class="pill-4" transform="translate(750, 0)">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" />
        <rect width="230" height="52" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.4" />
        <circle cx="26" cy="26" r="10" fill="#10b981" />
        <text x="26" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TT</text>
        <text x="48" y="24" class="font-title" font-size="14" fill="#f8fafc">stb_truetype &amp; SDF</text>
        <text x="48" y="40" class="font-sub" font-size="11" fill="#94a3b8">Header-only vector rasterization</text>
      </g>
    </g>

    <!-- Bottom Metrics & Status Bar -->
    <g transform="translate(0, 360)">
      <text x="0" y="15" class="font-mono" font-size="12" fill="#475569">
        TAGS: <tspan fill="#38bdf8">#EmbeddedFonts</tspan> · <tspan fill="#818cf8">#Typography</tspan> · <tspan fill="#c084fc">#FontRendering</tspan> · <tspan fill="#34d399">#Microcontroller</tspan> · <tspan fill="#f59e0b">#IoT</tspan>
      </text>
    </g>
  </g>

  <!-- High-tech Border Accent -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#primaryGrad)" />
</svg>
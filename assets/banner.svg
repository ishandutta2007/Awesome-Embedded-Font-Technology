<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="15"/></filter><pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity=".3"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.25}50%{transform:scale(1.15) translate(30px,-20px);opacity:.45}}@keyframes radarScan{0%{stroke-dashoffset:800}}@keyframes floatGlyph{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(2deg)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes beamFlow{0%{stroke-dashoffset:300}}.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800;letter-spacing:-1px}.font-sub{font-weight:400}.font-mono{font-family:&apos;SFMono-Regular&apos;,Consolas,&apos;Liberation Mono&apos;,Menlo,monospace}.orb-1,.orb-2{animation:pulseOrb 10s ease-in-out infinite;transform-origin:center}.orb-2{animation:pulseOrb 14s ease-in-out infinite reverse}.floating-letter{animation:floatGlyph 6s ease-in-out infinite}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPill 6s ease-in-out 1s infinite}.pill-3{animation:floatPill 7s ease-in-out 2s infinite}.pill-4{animation:floatPill 5.5s ease-in-out 1.5s infinite}.beam-line{stroke-dasharray:20,10;animation:beamFlow 12s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#matrixGrid)"/><circle cx="200" cy="120" r="180" fill="#38bdf8" class="orb-1" filter="url(#softGlow)"/><circle cx="1020" cy="300" r="220" fill="#818cf8" class="orb-2" filter="url(#softGlow)"/><circle cx="600" cy="210" r="280" fill="#c084fc" filter="url(#softGlow)" opacity=".12"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 100 L 250 100 L 320 170 L 600 170" class="beam-line" opacity=".35"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 1150 320 L 950 320 L 880 250 L 600 250" class="beam-line" opacity=".35"/><g class="floating-letter" opacity=".08"><text x="0" y="240" fill="none" stroke="#38bdf8" stroke-width="3" font-family="'Times New Roman', serif" font-size="280" font-weight="bold" transform="translate(900, 40)">A</text><text x="140" y="270" fill="none" stroke="#c084fc" stroke-width="2" font-family="'Courier New', monospace" font-size="200" font-weight="bold" transform="translate(900, 40)">a</text></g><g id="foreground-content"><g transform="translate(80, 0) translate(0, 68)"><rect width="220" height="32" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="16"/><circle cx="16" cy="16" r="4" fill="#38bdf8"/><text x="30" y="21" fill="#38bdf8" class="font-mono" font-size="12" font-weight="600" letter-spacing="1.5">AWESOME DIRECTORY</text></g><text x="0" y="155" fill="#fff" class="font-title" filter="url(#glow)" font-size="46" transform="translate(80, 0)">Awesome Embedded Font Technology</text><text x="0" y="196" fill="#94a3b8" class="font-sub" font-size="20" transform="translate(80, 0)">Curated Guide to Embedded Font Engines, Vector Rasterizers, Glyph Rendering &amp; Typography Solutions</text><text x="0" y="225" fill="#64748b" class="font-sub" font-size="15" transform="translate(80, 0)">From ultra-low-memory IoT microcontrollers to automotive HMIs, wearables, and multi-tenant SaaS rendering</text><g><g class="pill-1" transform="translate(80, 0) translate(0, 275) translate(0, 0)"><rect width="230" height="52" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><rect width="230" height="52" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity=".4" rx="12"/><circle cx="26" cy="26" r="10" fill="#0284c7"/><text x="26" y="30" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">FT</text><text x="48" y="24" fill="#f8fafc" class="font-title" font-size="14">FreeType 2 &amp; HarfBuzz</text><text x="48" y="40" fill="#94a3b8" class="font-sub" font-size="11">Industry standard open-source</text></g><g class="pill-2" transform="translate(80, 0) translate(0, 275) translate(250, 0)"><rect width="230" height="52" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><rect width="230" height="52" fill="none" stroke="#818cf8" stroke-width="1.5" opacity=".4" rx="12"/><circle cx="26" cy="26" r="10" fill="#6366f1"/><text x="26" y="30" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MT</text><text x="48" y="24" fill="#f8fafc" class="font-title" font-size="14">Monotype Spark™ / iType®</text><text x="48" y="40" fill="#94a3b8" class="font-sub" font-size="11">Automotive &amp; low-RAM MCUs</text></g><g class="pill-3" transform="translate(80, 0) translate(0, 275) translate(500, 0)"><rect width="230" height="52" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><rect width="230" height="52" fill="none" stroke="#c084fc" stroke-width="1.5" opacity=".4" rx="12"/><circle cx="26" cy="26" r="10" fill="#a855f7"/><text x="26" y="30" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LV</text><text x="48" y="24" fill="#f8fafc" class="font-title" font-size="14">LVGL &amp; U8g2 Micro-Fonts</text><text x="48" y="40" fill="#94a3b8" class="font-sub" font-size="11">Bitmap &amp; Sub-pixel on bare-metal</text></g><g class="pill-4" transform="translate(80, 0) translate(0, 275) translate(750, 0)"><rect width="230" height="52" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><rect width="230" height="52" fill="none" stroke="#34d399" stroke-width="1.5" opacity=".4" rx="12"/><circle cx="26" cy="26" r="10" fill="#10b981"/><text x="26" y="30" fill="#fff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">TT</text><text x="48" y="24" fill="#f8fafc" class="font-title" font-size="14">stb_truetype &amp; SDF</text><text x="48" y="40" fill="#94a3b8" class="font-sub" font-size="11">Header-only vector rasterization</text></g></g><g><text x="0" y="15" fill="#475569" class="font-mono" font-size="12" transform="translate(80, 0) translate(0, 360)">TAGS: <tspan fill="#38bdf8">#EmbeddedFonts</tspan> · <tspan fill="#818cf8">#Typography</tspan> · <tspan fill="#c084fc">#FontRendering</tspan> · <tspan fill="#34d399">#Microcontroller</tspan> · <tspan fill="#f59e0b">#IoT</tspan></text></g></g><rect width="1200" height="3" x="0" y="0" fill="url(#primaryGrad)"/></svg>